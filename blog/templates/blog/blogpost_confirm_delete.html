<!-- blog/templates/blog/blogpost_confirm_delete.html -->
{% extends "blog/base.html" %}

{% block title %}Delete Blog Post{% endblock %}

{% block content %}
<h1>Удалить пост</h1>
<p>Вы действительно хотите удалить пост "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Подтвердить</button>
</form>
<a class="btn btn-secondary" href="{% url 'blogpost_list' %}">Отмена</a>
{% endblock %}
