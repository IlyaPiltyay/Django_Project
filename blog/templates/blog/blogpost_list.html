<!-- blog/templates/blog/blogpost_list.html -->
{% extends "blog/base.html" %}

{% block title %}Blog Posts{% endblock %}

{% block content %}
<h1>Blog Posts</h1>
<ul class="list-group">
    {% for post in blog_posts %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <a href="{% url 'blogpost_detail' post.pk %}">{{ post.title }}</a>
            <span>
                <a class="btn btn-warning btn-sm" href="{% url 'blogpost_update' post.pk %}">Редактировать</a>
                <a class="btn btn-danger btn-sm" href="{% url 'blogpost_delete' post.pk %}">Отменить</a>
            </span>
        </li>
    {% endfor %}
</ul>
{% endblock %}
